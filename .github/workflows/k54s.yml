# K-54 S automatisch fuer Windows und macOS bauen.
# Start: bei jedem Push auf "main", der etwas im Ordner K54S/ aendert, oder per Hand
#        (Actions > K-54 S bauen > Run workflow).
# Ergebnis: unter Actions > Lauf > "Artifacts":  K-54-S-Windows (Setup.exe)  und  K-54-S-macOS (DMG)
# Ausserdem als Beta-Release (prerelease, nie "latest" – damit der K-54-Import nicht durcheinanderkommt) "k54s-v<Version aus K54S/CMakeLists.txt>".
name: K-54 S bauen

on:
  push:
    branches: [ main ]
    paths:
      - "K54S/**"
      - ".github/workflows/k54s.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Als Beta-Release veroeffentlichen (aus = nur Artifacts zum Testen)"
        type: boolean
        default: true
      draft:
        description: "Nur als privaten Entwurf hochladen (Test auf dem eigenen Rechner, nicht oeffentlich)"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: K54S

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren (Visual Studio, x64)
        run: cmake -B build -A x64 -DK55_COPY_AFTER_BUILD=OFF
      - name: Kompilieren
        run: cmake --build build --config Release --parallel --target K55_VST3 K55_Standalone
      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(K55 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} "/DBuildDir=$env:GITHUB_WORKSPACE\K54S\build\K55_artefacts\Release" Installer\windows\K54S.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-S-Windows
          path: K54S/dist/*.exe
      - name: Release
        if: github.event_name == 'push' || inputs.release || inputs.draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k54s-v${{ steps.ver.outputs.version }}${{ inputs.draft && '-test' || '' }}
          name: K-54 S ${{ steps.ver.outputs.version }}${{ inputs.draft && ' (Test)' || '' }}
          draft: ${{ inputs.draft == true }}
          target_commitish: ${{ github.sha }}
          body_path: K54S/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: K54S/dist/*.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apple-Zertifikat laden (wenn hinterlegt)
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Kein Apple-Zertifikat hinterlegt - Installer wird nur ad-hoc signiert."; exit 0; fi
          KC="$RUNNER_TEMP/k54.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          INS=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          [ -z "$INS" ] && INS=$(security find-certificate -a -c "Developer ID Installer" "$KC" | sed -n 's/.*"alis"<blob>="\(.*\)"/\1/p' | head -1)
          echo "Signiere als: ${APP:-?} / ${INS:-?}"
          [ -n "$APP" ] && echo "K54_SIGN_APP=$APP" >> "$GITHUB_ENV"
          [ -n "$INS" ] && echo "K54_SIGN_INSTALLER=$INS" >> "$GITHUB_ENV"
          true
      - name: "DMG bauen (Universal: Apple Silicon + Intel)"
        env:
          K54_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          K54_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          K54_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x make-installer.sh
          sed -i '' 's/^open -R.*$//' make-installer.sh
          ./make-installer.sh
          mkdir -p dist
          for f in K-54\ S-*-Installer.dmg; do mv "$f" "dist/${f// /-}"; done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-S-macOS
          path: K54S/dist/*.dmg
      - name: Version lesen
        id: ver
        run: echo "version=$(sed -nE 's/^project\(K55 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Release
        if: github.event_name == 'push' || inputs.release || inputs.draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k54s-v${{ steps.ver.outputs.version }}${{ inputs.draft && '-test' || '' }}
          name: K-54 S ${{ steps.ver.outputs.version }}${{ inputs.draft && ' (Test)' || '' }}
          draft: ${{ inputs.draft == true }}
          target_commitish: ${{ github.sha }}
          body_path: K54S/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: K54S/dist/*.dmg
