# K-54 Analyzer automatisch fuer Windows und macOS bauen.
# Start: bei jedem Push auf "main", der etwas im Ordner K54A/ aendert, oder per Hand
#        (Actions > K-54 Analyzer bauen > Run workflow).
# Ergebnis: unter Actions > Lauf > "Artifacts":  K-54-Analyzer-Windows (Setup.exe)  und  K-54-Analyzer-macOS (DMG)
# Ausserdem als Beta-Release (prerelease, nie "latest") "k54a-v<Version aus K54A/CMakeLists.txt>".
name: K-54 Analyzer bauen

on:
  push:
    branches: [ main ]
    paths:
      - "K54A/**"
      - ".github/workflows/k54a.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: K54A

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakete
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build xvfb
      - name: Tests bauen
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DK54A_BUILD_TESTS=ON
          cmake --build build --target K54ATest
      - name: Tests ausfuehren (EBU R128, A/B, Referenz)
        run: xvfb-run -a ./build/K54ATest_artefacts/Release/K54ATest out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren (Visual Studio, x64)
        run: cmake -B build -A x64
      - name: Kompilieren
        run: cmake --build build --config Release --parallel --target K54Analyzer_VST3 K54Analyzer_Standalone
      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(K54A VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} "/DBuildDir=$env:GITHUB_WORKSPACE\K54A\build\K54Analyzer_artefacts\Release" Installer\windows\K54A.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-Analyzer-Windows
          path: K54A/dist/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k54a-v${{ steps.ver.outputs.version }}
          name: K-54 Analyzer ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: K54A/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: K54A/dist/*.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apple-Zertifikat laden (wenn hinterlegt)
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Kein Apple-Zertifikat hinterlegt - Installer wird nur ad-hoc signiert."; exit 0; fi
          KC="$RUNNER_TEMP/k54.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          INS=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          [ -z "$INS" ] && INS=$(security find-certificate -a -c "Developer ID Installer" "$KC" | sed -n 's/.*"alis"<blob>="\(.*\)"/\1/p' | head -1)
          echo "Signiere als: ${APP:-?} / ${INS:-?}"
          [ -n "$APP" ] && echo "K54_SIGN_APP=$APP" >> "$GITHUB_ENV"
          [ -n "$INS" ] && echo "K54_SIGN_INSTALLER=$INS" >> "$GITHUB_ENV"
          true
      - name: "DMG bauen (Universal: Apple Silicon + Intel)"
        env:
          K54_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          K54_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          K54_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x make-installer.sh
          sed -i '' 's/^open -R.*$//' make-installer.sh
          ./make-installer.sh
          mkdir -p dist
          for f in K-54\ Analyzer-*-Installer.dmg; do mv "$f" "dist/${f// /-}"; done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-Analyzer-macOS
          path: K54A/dist/*.dmg
      - name: Version lesen
        id: ver
        run: echo "version=$(sed -nE 's/^project\(K54A VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k54a-v${{ steps.ver.outputs.version }}
          name: K-54 Analyzer ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: K54A/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: K54A/dist/*.dmg
