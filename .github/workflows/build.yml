# K-54 automatisch fuer Windows und macOS bauen.
# Start: bei jedem Push auf "main" oder per Hand (Actions > K-54 bauen > Run workflow).
# Ergebnis: unter Actions > Lauf > "Artifacts":  K-54-Windows (MSI + Setup.exe)  und  K-54-macOS (DMG)
# Jeder Push auf main veroeffentlicht die Installer als GitHub-Release "v<Version aus CMakeLists.txt>".
# keller54.de holt sie von dort (K-54 Updates > Von GitHub holen).
name: K-54 bauen

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "K54S/**"
      - ".github/workflows/k54s.yml"
      - "K54A/**"
      - ".github/workflows/k54a.yml"
      - "K54D/**"
      - ".github/workflows/k54d.yml"
      - "Handbuch/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren (Visual Studio, x64)
        run: cmake -B build -A x64 -DK54_COPY_AFTER_BUILD=OFF
      - name: Kompilieren
        run: cmake --build build --config Release --parallel --target K54_VST3 K54_Standalone
      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(K54 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} "/DBuildDir=$env:GITHUB_WORKSPACE\build\K54_artefacts\Release" Installer\windows\K54.iss
      - name: MSI bauen (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build Installer\windows\K54.wxs -ext WixToolset.UI.wixext -culture de-DE -arch x64 `
            -d "Version=${{ steps.ver.outputs.version }}" `
            -d "BuildDir=$env:GITHUB_WORKSPACE\build\K54_artefacts\Release" `
            -o "dist\K-54-${{ steps.ver.outputs.version }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-Windows
          path: |
            dist/*.msi
            dist/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: K-54 ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.msi
            dist/*.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apple-Zertifikat laden (wenn hinterlegt)
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Kein Apple-Zertifikat hinterlegt - Installer wird nur ad-hoc signiert."; exit 0; fi
          KC="$RUNNER_TEMP/k54.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          INS=$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          [ -z "$INS" ] && INS=$(security find-certificate -a -c "Developer ID Installer" "$KC" | sed -n 's/.*"alis"<blob>="\(.*\)"/\1/p' | head -1)
          echo "Signiere als: ${APP:-?} / ${INS:-?}"
          [ -n "$APP" ] && echo "K54_SIGN_APP=$APP" >> "$GITHUB_ENV"
          [ -n "$INS" ] && echo "K54_SIGN_INSTALLER=$INS" >> "$GITHUB_ENV"
          true
      - name: DMG bauen
        env:
          K54_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          K54_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          K54_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x make-installer.sh
          sed -i '' 's/^open -R.*$//' make-installer.sh
          ./make-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-macOS
          path: K-54-*-Installer.dmg
      - name: Version lesen
        id: ver
        run: echo "version=$(sed -nE 's/^project\(K54 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: K-54 ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: K-54-*-Installer.dmg
