# K-54 automatisch fuer Windows und macOS bauen.
# Start: bei jedem Push auf "main" oder per Hand (Actions > K-54 bauen > Run workflow).
# Ergebnis: unter Actions > Lauf > "Artifacts":  K-54-Windows (MSI + Setup.exe)  und  K-54-macOS (DMG)
# Jeder Push auf main veroeffentlicht die Installer als GitHub-Release "v<Version aus CMakeLists.txt>".
# keller54.de holt sie von dort (K-54 Updates > Von GitHub holen).
name: K-54 bauen

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "K54S/**"
      - ".github/workflows/k54s.yml"
      - "K54A/**"
      - ".github/workflows/k54a.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren (Visual Studio, x64)
        run: cmake -B build -A x64 -DK54_COPY_AFTER_BUILD=OFF
      - name: Kompilieren
        run: cmake --build build --config Release --parallel --target K54_VST3 K54_Standalone
      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(K54 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} "/DBuildDir=$env:GITHUB_WORKSPACE\build\K54_artefacts\Release" Installer\windows\K54.iss
      - name: MSI bauen (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build Installer\windows\K54.wxs -ext WixToolset.UI.wixext -culture de-DE -arch x64 `
            -d "Version=${{ steps.ver.outputs.version }}" `
            -d "BuildDir=$env:GITHUB_WORKSPACE\build\K54_artefacts\Release" `
            -o "dist\K-54-${{ steps.ver.outputs.version }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-Windows
          path: |
            dist/*.msi
            dist/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: K-54 ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.msi
            dist/*.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: DMG bauen
        run: |
          chmod +x make-installer.sh
          sed -i '' 's/^open -R.*$//' make-installer.sh
          ./make-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: K-54-macOS
          path: K-54-*-Installer.dmg
      - name: Version lesen
        id: ver
        run: echo "version=$(sed -nE 's/^project\(K54 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: K-54 ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: K-54-*-Installer.dmg
